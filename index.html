<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Rent Manager Uganda</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                    font-family: Arial, sans-serif;
                                        }

                                            body {
                                                  background: #f4f6f8;
                                                        color: #1f2937;
                                                            }

                                                                header {
                                                                      background: #0b5ed7;
                                                                            color: white;
                                                                                  padding: 20px;
                                                                                        text-align: center;
                                                                                            }

                                                                                                header h1 {
                                                                                                      margin-bottom: 8px;
                                                                                                          }

                                                                                                              .container {
                                                                                                                    max-width: 1100px;
                                                                                                                          margin: auto;
                                                                                                                                padding: 20px;
                                                                                                                                    }

                                                                                                                                        .welcome {
                                                                                                                                              background: white;
                                                                                                                                                    padding: 25px;
                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                margin-bottom: 20px;
                                                                                                                                                                      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                                                                                                                                                                          }

                                                                                                                                                                              .dashboard {
                                                                                                                                                                                    display: grid;
                                                                                                                                                                                          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                                                                                                                                                                                                gap: 15px;
                                                                                                                                                                                                    }

                                                                                                                                                                                                        .card {
                                                                                                                                                                                                              background: white;
                                                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                                                                                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                        .card h3 {
                                                                                                                                                                                                                                              margin-bottom: 10px;
                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                      .card p {
                                                                                                                                                                                                                                                            font-size: 24px;
                                                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                                                        color: #0b5ed7;
                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                .actions {
                                                                                                                                                                                                                                                                                      margin-top: 25px;
                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                  flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                        gap: 10px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                button {
                                                                                                                                                                                                                                                                                                                      background: #0b5ed7;
                                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                                                                                                        padding: 12px 18px;
                                                                                                                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                          font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                  button:hover {
                                                                                                                                                                                                                                                                                                                                                                        background: #084298;
                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                footer {
                                                                                                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                            padding: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                  margin-top: 30px;
                                                                                                                                                                                                                                                                                                                                                                                                        color: #666;
                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                                                                                                                              </head>

                                                                                                                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                                                                                                                                <header>
                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>Rent Manager Uganda</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Property & Rent Management System</p>
                                                                                                                                                                                                                                                                                                                                                                                                                          </header>

                                                                                                                                                                                                                                                                                                                                                                                                                            <main class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="welcome">
                                                                                                                                                                                                                                                                                                                                                                                                                                      <h2>Welcome to Rent Manager Uganda</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    Manage properties, tenants, rent payments and rental records
                                                                                                                                                                                                                                                                                                                                                                                                                                                            from one place.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <section class="dashboard">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Properties</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>0</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>Tenants</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>0</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Rent Collected</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>UGX 0</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>Outstanding Rent</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>UGX 0</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <section class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="addProperty()">Add Property</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button onclick="addTenant()">Add Tenant</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="recordPayment()">Record Payment</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>© 2026 Rent Manager Uganda</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function addProperty() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Property management module coming next.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function addTenant() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Tenant management module coming next.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function recordPayment() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert("Rent payment module coming next.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
